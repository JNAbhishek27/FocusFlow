services:
  # Development services
  postgres:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "8090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: focus_flow
      POSTGRES_PASSWORD: "mQpETbe1AfTr1WNJ4UwKZ6xaJ6QA5vK_"
    volumes:
      - focus_flow_data:/var/lib/postgresql/data

  redis:
    image: redis:6.2.6
    ports:
      - "8091:6379"
    command: redis-server --requirepass "BrvLOo6HDZe_8OyVreFbUkmABCJtgg57"
    environment:
      - REDIS_REPLICATION_MODE=master

  # Test services
  postgres_test:
    image: ghcr.io/serverpod/postgres:16
    ports:
      - "9090:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: focus_flow_test
      POSTGRES_PASSWORD: "vHuIvRiopJtlyscRe8Otjj0St2PukY2E"
    volumes:
      - focus_flow_test_data:/var/lib/postgresql/data

  redis_test:
    image: redis:6.2.6
    ports:
      - "9091:6379"
    command: redis-server --requirepass "90yQQDiA98UvfAIn5qnMs-m47Yo8g6mz"
    environment:
      - REDIS_REPLICATION_MODE=master

volumes:
  focus_flow_data:
  focus_flow_test_data:
